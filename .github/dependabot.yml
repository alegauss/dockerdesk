# Dependency updates, opened as pull requests so they arrive through the gates rather than beside
# them. A bump proposed here runs check.yml on Windows — build, test, publish, and the started .exe —
# which is the same evidence any hand-written change has to produce. That is the whole reason this
# file exists: the alternative is somebody editing a version by hand and finding out at release.
#
# Three ecosystems, because the repository holds three kinds of manifest and no more:
#   github-actions  .github/workflows/*.yml            (and the composite action beside them)
#   nuget           src/*/*.csproj, tests/*/*.csproj
#   npm             site/package.json
#
# One group per ecosystem, `patterns: ["*"]` and no update-type filter: three pull requests a week
# at most, whatever moved. Ungrouped, a quiet week in site/ alone is a dozen — and a dozen PRs each
# spending a Windows runner on the same solution is a queue nobody reads by Wednesday.
#
# The cost is stated rather than hidden: a grouped PR that goes red does not name which bump did
# it. The answer is not to un-group — it is that the branch is right there, so `git revert` the one
# manifest line, or close the PR and let the next run reopen it minus whatever was pinned in the
# meantime. That is a minute of work on the rare red, against a dozen reviews on every green.

version: 2

updates:
  # ── the workflows themselves ────────────────────────────────────────────────────────────────
  #
  # `/` means .github/workflows for this ecosystem — it is not the repository root in the sense
  # the other two entries use it. The composite action is named separately because Dependabot does
  # not reach it from `/`; it holds no `uses:` today, and is listed so that the day it gains one is
  # not the day this file quietly stops covering everything.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/inno-setup"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(ci)
    open-pull-requests-limit: 5
    groups:
      # One PR a week for every action, majors included — see the note at the top of the file.
      actions:
        patterns: ["*"]

  # ── the .NET solution ───────────────────────────────────────────────────────────────────────
  #
  # The root, not src/ and tests/ one at a time: the NuGet updater walks down from the directory it
  # is given, so a project added later is covered without this file being touched. Directory.Build.props
  # is read on the way past, which is where a central property would land if one is ever added.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    open-pull-requests-limit: 5
    groups:
      # Everything the solution references, in one PR. The xunit stack is the reason this is not
      # even a close call: runner, adapter and framework disagreeing about a version is a test host
      # that will not start, so splitting them into three PRs is reviewing two builds that were
      # never going to be green on their own.
      nuget:
        patterns: ["*"]

  # ── the public site ─────────────────────────────────────────────────────────────────────────
  #
  # site/ has its own lockfile and its own gate (site.yml runs `npm ci && npm run build && npm test`
  # on every push), so a bump here is checked by the build that generates the surface, the SSR pass
  # and the prerender — the same three things DD88 made run on every push rather than on publish.
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    open-pull-requests-limit: 5
    groups:
      # One PR, dependencies and devDependencies together. Splitting them here would be a division
      # the site does not have: react, @types/react and vite's react plugin are one decision, and
      # only two of the three are runtime.
      site:
        patterns: ["*"]
